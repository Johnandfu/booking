name: hcms

volumes:
  hcms_redis_data:
  hcms_mysql_data:
  hcms_certbot_data:

services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
      args:
        ENABLE_SSL: ${ENABLE_SSL}
        CERTBOT_DOMAIN: ${CERTBOT_DOMAIN}
        ADMIN_DOMAIN: ${ADMIN_DOMAIN}
        CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/hyperf-cms:ro
      - hcms_certbot_data:/etc/letsencrypt
    environment:
      ENABLE_SSL: ${ENABLE_SSL}
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    depends_on:
      - hyperf
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - hcms_redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_AUTH}
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - TZ=Asia/Shanghai

  mysql:
    image: mysql:8.4
    volumes:
      - hcms_mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command:
      - --max_connections=500
      - --wait_timeout=600
      - --interactive_timeout=600
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai

  hyperf:
    image: hyperf/hyperf:8.3-alpine-v3.22-swoole
    volumes:
      - ./:/opt/www/hyperf-cms
    working_dir: /opt/www/hyperf-cms
    depends_on:
      - redis
      - mysql
    environment:
      TZ: Asia/Shanghai
    command: php bin/hyperf.php start
    restart: always
