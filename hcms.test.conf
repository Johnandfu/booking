
upstream hcms-hyperf {
    # Hyperf HTTP Server 的 IP 及 端口
    server php-alpine:9508;
}
server {
    listen 80;
    server_name hcms.test;
    client_max_body_size 50M;
    # --- real IP 配置 ---
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0; # 信任所有来源（可改成 Docker 内网网段，例如 172.16.0.0/12）

    # Certbot 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP 跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# --- HTTPS ---
server {
    listen 443 ssl;
    server_name hcms.test;
    ssl_certificate /etc/nginx/ssl/jiale_cas.org.pem;
    ssl_certificate_key /etc/nginx/ssl/jiale_cas.org.key;

    # 简化后的 SSL 设置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 日志
    access_log /var/log/nginx/hcms.access.log;
    error_log /var/log/nginx/hcms.log;
    # --- real IP 配置 ---
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0; # 信任所有来源（可改成 Docker 内网网段，例如 172.16.0.0/12）
    root /var/www/hyperf-cms/web/dist;
    index index.html;
    # 客户端配置
    client_max_body_size 128M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_connect_timeout 300;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /uploads/ {
        alias /var/www/hyperf-cms/storage/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 代理到 Hyperf ---
    location ~ ^/(api|admin)/ {
        # --- CORS 设置 ---
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # 预检请求快速返回
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        proxy_pass http://hcms-hyperf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ /\.ht {
        deny all;
    }
}
